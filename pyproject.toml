[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lbm-overhead-monitor"
version = "0.1.0"
description = "Scripts to access and pre-process liveability monitoring data over The Netherlands"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "geopandas",
    "numpy",
    "owslib",
    "pandas",
    "Pillow",
    "pyproj",
    "rasterio",
    "requests",
    "shapely",
    "tqdm",
    # GDAL (osgeo) must be installed separately — the PyPI wheel requires
    # matching system GDAL headers. Install via conda/mamba or your distro:
    #   conda install -c conda-forge gdal
    # or follow https://pypi.org/project/GDAL/ for the pip wheel.
]

[project.urls]
Repository = "https://github.com/ahlevering/LBMOverheadMonitor"

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*"]
